<div class="fondo">
  <div class="ventana">
    <h2>{{ titulo() }}</h2>
    <p>{{ texto() }}</p>
    <div class="botones">
      <button (click)="tocarBoton()">{{ textoBoton() }}</button>
      @if (textoCancelar() !== '') {
        <button class="cancelar" (click)="tocarCancelar()">{{ textoCancelar() }}</button>
      }
    </div>
  </div>
</div>
